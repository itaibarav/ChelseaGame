<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול חדשות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#071A38;color:#fff;font-family:Rubik,system-ui,sans-serif;padding:20px 14px 60px}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:'Secular One';font-weight:400;font-size:26px;margin:0 0 4px}
p.sub{color:#9FB8DA;font-size:13px;line-height:1.6;margin:0 0 18px}
label{display:block;font-size:12.5px;color:#C6D8F2;margin:12px 0 5px;font-weight:700}
input,textarea{width:100%;background:rgba(0,0,0,.3);color:#fff;border:1.5px solid rgba(255,255,255,.2);
  border-radius:10px;padding:10px;font-size:14px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
button{font-family:inherit;font-weight:700;font-size:14px;border:0;border-radius:11px;padding:11px 18px;cursor:pointer;
  background:linear-gradient(180deg,#FFD766,#E09800);color:#3A2400;margin-top:14px}
button.ghost{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.22)}
.post{display:flex;gap:11px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);
  border-radius:14px;padding:10px;margin-top:10px;align-items:flex-start}
.post img{width:74px;height:74px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:#0D2E5E}
.post .t{flex:1;font-size:13px;line-height:1.55}
.post small{color:#8FA3C0;font-size:11px;display:block;margin-top:4px}
.post .x{background:rgba(229,37,42,.3);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;margin:0}
.msg{margin-top:12px;font-size:13px;color:#8FE0A0;min-height:18px}
</style></head><body><div class="wrap">
<h1>ניהול חדשות</h1>
<p class="sub">כל פוסט שתוסיף כאן יופיע באפליקציה כקטע קריאה ויזכה את הילד ב-10 מטבעות בקריאה הראשונה.
העתק את קישור הפוסט מאינסטגרם, את כתובת התמונה שלו ואת הכיתוב.</p>

<label>סיסמת ניהול</label><input id="tok" type="password" placeholder="adminToken מתוך config.json">
<label>כיתוב</label><textarea id="cap" placeholder="מה כתוב בפוסט"></textarea>
<label>כתובת תמונה</label><input id="img" placeholder="https://...jpg">
<label>קישור לפוסט (לא חובה)</label><input id="link" placeholder="https://www.instagram.com/p/...">
<button id="add">הוסף פוסט</button>
<button class="ghost" id="load">רענן רשימה</button>
<div class="msg" id="msg"></div>
<div id="list"></div>

<script>
const $=s=>document.querySelector(s);
const tok=()=>$('#tok').value.trim();
const msg=t=>$('#msg').textContent=t;
async function load(){
  const r=await fetch('/admin/news',{headers:{'X-Admin-Token':tok()}});
  if(!r.ok)return msg('סיסמה שגויה');
  const list=await r.json();
  $('#list').innerHTML=list.map(p=>`<div class="post">
    <img src="${p.imageLocal||p.image||''}" onerror="this.style.visibility='hidden'">
    <div class="t">${(p.caption||'(ללא כיתוב)').slice(0,180)}
      <small>${new Date(p.timestamp).toLocaleString('he-IL')}</small></div>
    <button class="x" data-del="${p.id}">מחק</button></div>`).join('')||'<p class="sub">אין עדיין פוסטים</p>';
  msg(list.length+' פוסטים');
}
$('#add').addEventListener('click',async()=>{
  const body={caption:$('#cap').value,image:$('#img').value,permalink:$('#link').value};
  const r=await fetch('/admin/news',{method:'POST',
    headers:{'Content-Type':'application/json','X-Admin-Token':tok()},body:JSON.stringify(body)});
  if(!r.ok)return msg('נכשל: '+(await r.json()).error);
  $('#cap').value='';$('#img').value='';$('#link').value='';
  msg('נוסף');load();
});
$('#load').addEventListener('click',load);
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-del]');if(!b)return;
  await fetch('/admin/news/'+encodeURIComponent(b.dataset.del),
    {method:'DELETE',headers:{'X-Admin-Token':tok()}});
  load();
});
</script></div></body></html>
