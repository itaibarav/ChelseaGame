<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>השלמת תמונות — אצטדיון וערכות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#071A38;color:#fff;font-family:Rubik,system-ui,sans-serif;padding:18px 14px 70px}
.wrap{max-width:1060px;margin:0 auto}
h1{font-family:'Secular One';font-weight:400;font-size:27px;margin:0 0 4px}
.sub{color:#9FB8DA;font-size:13.5px;margin:0 0 16px;line-height:1.65;max-width:800px}
.btn{font-weight:700;font-size:13.5px;border:0;border-radius:11px;padding:10px 16px;cursor:pointer;font-family:inherit}
.go{background:linear-gradient(180deg,#FFD766,#E09800);color:#3A2400}
.alt{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.22)}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;position:sticky;top:0;
  background:#071A38;padding:10px 0;z-index:20;border-bottom:1px solid rgba(255,255,255,.1)}
.pill{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:999px;
  padding:7px 14px;font-size:12.5px;font-weight:700}
.pill b{color:#FFC83D;font-family:'Secular One';font-size:15px}
.grp{margin-bottom:22px}
.grp h2{font-family:'Secular One';font-weight:400;font-size:20px;margin:0 0 10px;
  display:flex;align-items:center;gap:10px}
.grp h2 small{font-size:12px;color:#9FB8DA;font-family:Rubik}
.tiles{display:grid;gap:11px}
.g-stadium .tiles{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
.g-kit .tiles{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.tile{background:rgba(0,0,0,.24);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:8px;
  display:flex;flex-direction:column;gap:6px;position:relative}
.tile.done{border-color:rgba(60,200,120,.55);background:rgba(60,200,120,.07)}
.tile.stock{border-color:rgba(143,163,192,.35)}
.box{border-radius:8px;overflow:hidden;background:#0D2E5E;display:grid;place-items:center}
.g-stadium .box{aspect-ratio:3/4}
.g-kit .box{aspect-ratio:3/2;background:linear-gradient(180deg,#0E3D7E,#04204F)}
.box img{width:100%;height:100%;object-fit:cover;display:block}
.g-kit .box img{object-fit:contain}
.nm{font-size:11.5px;line-height:1.3;min-height:30px}
.no{position:absolute;top:5px;inset-inline-start:6px;background:rgba(3,20,46,.85);border-radius:6px;
  padding:1px 6px;font-size:10px;font-family:'Secular One';z-index:2}
.tag{position:absolute;top:5px;inset-inline-end:6px;font-size:9.5px;font-weight:700;border-radius:6px;
  padding:2px 6px;z-index:2}
.tag.stock{background:rgba(143,163,192,.85);color:#08203F}
.tag.new{background:#22C55E;color:#04250F}
.row{display:flex;gap:5px}
.up{flex:1;text-align:center;background:linear-gradient(180deg,#FFD766,#E09800);color:#3A2400;
  border-radius:8px;padding:6px;font-size:11.5px;font-weight:700;cursor:pointer}
.up input{display:none}
.x{background:rgba(229,37,42,.3);border:0;border-radius:8px;color:#fff;padding:6px 9px;cursor:pointer;font-size:11px}
.log{margin-top:14px;background:rgba(0,0,0,.32);border-radius:12px;padding:12px;font-size:12px;
  color:#9FB8DA;max-height:150px;overflow:auto;white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>השלמת תמונות</h1>
  <p class="sub">רק שתי הקטגוריות שחסרות להן תמונות טובות. עשר מדבקות האצטדיון ריקות לגמרי,
  וארבע-עשרה הערכות מציגות את ההרכבה מוויקישיתוף — אפשר להחליף כל אחת בתמונה שלך.
  תמונות אצטדיון נחתכות ליחס הקלף, ותמונות ערכה ליחס רוחבי, כדי שייכנסו נכון.</p>

    <button class="btn alt" id="clear">נקה הכול</button>
    <span class="pill" id="tally"></span>
  </div>

  <div id="groups"></div>
  <div class="log" id="log">מוכן.</div>
</div>

let MINE={};   // id -> dataURI

const $=s=>document.querySelector(s);
const log=m=>{const l=$('#log');l.textContent+='\n'+m;l.scrollTop=l.scrollHeight;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- אחסון ---------- */
const db=()=>new Promise((res,rej)=>{const r=indexedDB.open('fill-studio',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function save(){try{const d=await db();
  await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');
    t.objectStore('kv').put(JSON.stringify(MINE),'fill');t.oncomplete=res;t.onerror=()=>rej(t.error);});
}catch(e){log('שמירה נכשלה: '+e.message);}}
async function load(){try{const d=await db();
  const v=await new Promise((res,rej)=>{const t=d.transaction('kv','readonly'),q=t.objectStore('kv').get('fill');
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
  if(v){MINE=JSON.parse(v);log('נטענו '+Object.keys(MINE).length+' תמונות שמורות');}
}catch(e){}}

/* ---------- חיתוך לפי סוג ---------- */
async function crop(file,ratio){
  const [rw,rh]=ratio.split('/').map(Number);
  const W = rw>rh ? 420 : 320;
  const H = Math.round(W*rh/rw);
  const bmp=await createImageBitmap(file);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const s=Math.max(W/bmp.width,H/bmp.height);
  const dw=bmp.width*s,dh=bmp.height*s;
  x.drawImage(bmp,(W-dw)/2,(H-dh)/2,dw,dh);
  return c.toDataURL('image/jpeg',.84);
}

/* ---------- render ---------- */
function render(){
  const total=DATA.groups.reduce((n,g)=>n+g.items.length,0);
  $('#tally').innerHTML=`הוחלפו <b>${Object.keys(MINE).length}</b> מתוך ${total}`;
  $('#groups').innerHTML=DATA.groups.map(g=>{
    const mine=g.items.filter(i=>MINE[i.id]).length;
    return `<div class="grp g-${g.key}">
      <h2>${esc(g.label)} <small>${g.items.length} מדבקות · ${mine} תמונות שלך</small></h2>
      <div class="tiles">${g.items.map(it=>{
        const img=MINE[it.id]||it.cur;
        const cls=MINE[it.id]?'done':(it.cur?'stock':'');
        const tag=MINE[it.id]?'<span class="tag new">שלך</span>'
                 :(it.cur?'<span class="tag stock">קיים</span>':'');
        return `<div class="tile ${cls}">
          <span class="no">#${it.no}</span>${tag}
          <div class="box">${img?`<img src="${img}">`:'<span style="opacity:.3;font-size:22px">—</span>'}</div>
          <div class="nm">${esc(it.name)}</div>
          <div class="row">
            <label class="up">בחר תמונה<input type="file" accept="image/*" data-up="${it.id}" data-ratio="${g.ratio}"></label>
            ${MINE[it.id]?`<button class="x" data-del="${it.id}">✕</button>`:''}
          </div></div>`;}).join('')}</div></div>`;}).join('');
}

document.addEventListener('change',async e=>{
  const inp=e.target.closest('[data-up]');
  if(inp&&inp.files[0]){
    MINE[inp.dataset.up]=await crop(inp.files[0],inp.dataset.ratio);
    inp.value='';await save();render();log('↑ '+inp.dataset.up);
    return;
  }
  const f=e.target.closest('#import');
  if(f&&f.files[0]){
    try{const w={};new Function('window',await f.text())(w);
      MINE=w.FILL_PHOTOS||{};await save();render();log('יובא '+f.files[0].name);}
    catch(err){log('ייבוא נכשל: '+err.message);}
  }
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-del]');
  if(b){delete MINE[b.dataset.del];await save();render();}
});
$('#export').addEventListener('click',()=>{
  const txt='window.FILL_PHOTOS='+JSON.stringify(MINE)+';\n';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));
  a.download='fill.js';a.click();
  log('נוצר fill.js — '+Object.keys(MINE).length+' תמונות, '+(txt.length/1048576).toFixed(2)+'MB');
});
$('#clear').addEventListener('click',async()=>{
  if(!confirm('למחוק את כל התמונות שהעלית כאן?'))return;
  MINE={};await save();render();
});

load().then(render);
</script>
</body>
</html>
